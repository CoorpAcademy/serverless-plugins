version: "3"
services:
  kinesis:
    image: instructure/kinesalite:latest
    ports:
      - "4567:4567"

  dynamodb:
    image: amazon/dynamodb-local:latest
    ports:
      - "8000:8000"

  sqs:
    image: softwaremill/elasticmq-native:latest
    ports:
      - "9324:9324"
    command: "-Dnode-address.host=\"*\""

  s3:
    # MinIO no longer publishes public images (Docker Hub and quay.io both 401 on
    # every tag and digest). Chainguard builds the same MinIO server from the
    # AGPLv3 source and publishes it on ECR Public, which pulls anonymously.
    image: public.ecr.aws/chainguard/minio:latest
    command: server /data
    ports:
      - "9000:9000"
